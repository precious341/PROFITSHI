<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore WebSocket HMR errors in cloud preview iframe per environment guidelines
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || (e.reason.stack && e.reason.stack.includes('@vite/client')))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
